name: luasec
description: Scan Lua firmware code for remote code execution, and upload the result to code scanning.
branding:
  icon: shield
  color: gray-dark
inputs:
  path:
    description: Files or directories to scan, space separated.
    default: "."
  std:
    description: Platform profiles, e.g. +openwrt+luci. Empty for generic Lua only.
    default: ""
  fail-on:
    description: Fail the job at or above this severity (low, medium, high, critical).
    default: high
  args:
    description: Extra luasec arguments.
    default: ""
  upload-sarif:
    description: Upload the SARIF report to GitHub code scanning (needs security-events write).
    default: "true"
outputs:
  score:
    description: The 0-100 health score.
    value: ${{ steps.scan.outputs.score }}
runs:
  using: composite
  steps:
    - name: Build luasec
      shell: bash
      run: make -C "$GITHUB_ACTION_PATH" lua vendor
    - name: Scan
      id: scan
      shell: bash
      env:
        LUASEC_PATHS: ${{ inputs.path }}
        LUASEC_STD: ${{ inputs.std }}
        LUASEC_FAIL_ON: ${{ inputs.fail-on }}
        LUASEC_ARGS: ${{ inputs.args }}
      run: |
        std=()
        if [ -n "$LUASEC_STD" ]; then std=(--std "$LUASEC_STD"); fi
        # shellcheck disable=SC2086
        set +e
        # Keep --format/-o after $LUASEC_ARGS so user args cannot override where the SARIF goes.
        "$GITHUB_ACTION_PATH/bin/luasec" "${std[@]}" --fail-on "$LUASEC_FAIL_ON" $LUASEC_ARGS \
          --format sarif -o luasec.sarif $LUASEC_PATHS
        status=$?
        score=$(jq -r '.runs[0].properties.score.value // empty' luasec.sarif 2>/dev/null || true)
        set -e
        echo "score=$score" >> "$GITHUB_OUTPUT"
        if [ -n "$score" ]; then echo "luasec score: $score/100" >> "$GITHUB_STEP_SUMMARY"; else echo "luasec score: unavailable" >> "$GITHUB_STEP_SUMMARY"; fi
        echo "status=$status" >> "$GITHUB_OUTPUT"
    - name: Upload SARIF
      if: ${{ always() && inputs.upload-sarif == 'true' }}
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: luasec.sarif
        category: luasec
    - name: Gate
      shell: bash
      env:
        LUASEC_STATUS: ${{ steps.scan.outputs.status }}
      run: exit "$LUASEC_STATUS"
