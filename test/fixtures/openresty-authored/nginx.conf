# An AUTHORED nginx.conf for measuring lua-doctor on OpenResty request handlers (#296).
#
# It is written by the maintainers, not taken from a deployment. Every location carries, as
# its first Lua line, the author's intent: `-- expect: <codes>` (the finding codes a careful
# reviewer would want from this handler) or `-- expect: none` (a handler that is safe). The
# measurement compares that intent with what lua-doctor reports. It measures what is written here
# and nothing else: it is not real-world recall and not real-world precision.
worker_processes 1;
events { worker_connections 64; }

http {
    server {
        listen 8080;

        location = /healthz {
            content_by_lua_block {
                -- expect: none
                ngx.say('{"status":"ok"}')
            }
        }

        location = /go {
            content_by_lua_block {
                -- expect: 730
                local target = ngx.req.get_uri_args().to
                return ngx.redirect(target)
            }
        }

        location = /next {
            content_by_lua_block {
                -- expect: none
                return ngx.redirect("/login?next=" .. ngx.escape_uri(ngx.var.arg_next))
            }
        }

        location = /handoff {
            content_by_lua_block {
                -- expect: 709
                local target = ngx.var.arg_next
                return ngx.exec(target)
            }
        }

        location = /fallback {
            content_by_lua_block {
                -- expect: none
                return ngx.exec("@fallback")
            }
        }

        location = /forward-host {
            content_by_lua_block {
                -- expect: 730
                local hdrs = ngx.req.get_headers()
                ngx.req.set_header("X-Forwarded-Host", hdrs["host"])
                return ngx.exec("@upstream")
            }
        }

        location = /cache-key {
            content_by_lua_block {
                -- expect: 730
                ngx.header["X-Cache-Key"] = ngx.var.uri
                ngx.say("ok")
            }
        }

        location = /served-by {
            content_by_lua_block {
                -- expect: none
                ngx.header["X-Served-By"] = "edge-1"
                ngx.say("ok")
            }
        }

        location = /proxy {
            content_by_lua_block {
                -- expect: 731
                local args = ngx.req.get_post_args()
                local res = ngx.location.capture("/upstream/" .. args.path)
                ngx.say(res.body)
            }
        }

        location = /ping {
            content_by_lua_block {
                -- expect: 709
                os.execute("ping -c1 " .. ngx.var.arg_host)
            }
        }

        location = /ping-checked {
            content_by_lua_block {
                -- expect: none
                local host = ngx.var.arg_host
                if not host:match("^[%w%.%-]+$") then
                    return ngx.exit(400)
                end
                os.execute("ping -c1 " .. host)
            }
        }

        location = /kill {
            content_by_lua_block {
                -- expect: none
                local pid = tonumber(ngx.var.arg_pid)
                os.execute(string.format("kill %d", pid))
            }
        }

        location = /dns {
            content_by_lua_block {
                -- expect: 709
                local host = ngx.req.get_uri_args().h
                local out = io.popen("nslookup " .. host):read("*a")
                ngx.say(out)
            }
        }

        location = /run {
            content_by_lua_block {
                -- expect: 709
                ngx.req.read_body()
                local body = require("cjson").decode(ngx.req.get_body_data())
                os.execute(body.cmd)
            }
        }

        location = /find {
            content_by_lua_block {
                -- expect: 728
                local pattern = ngx.req.get_uri_args().q
                local from = ngx.re.find(ngx.var.uri, pattern, "jo")
                ngx.say(from)
            }
        }
    }
}
