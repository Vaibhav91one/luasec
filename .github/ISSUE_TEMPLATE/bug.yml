name: Bug
about: Something in lua-doctor behaves wrongly
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What did you expect, and what did lua-doctor do instead?
    validations:
      required: true
  - type: textarea
    id: snippet
    attributes:
      label: Lua that triggers it
      description: The smallest Lua snippet that shows the behaviour.
      render: lua
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: lua-doctor version
    validations:
      required: true
