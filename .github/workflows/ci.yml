name: ci
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

# A push or a label change starts a newer run for the same pull request; the
# older one is stale (the first run of a PR opened with a label sees no label),
# so it is cancelled. Runs on main are never cancelled.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  security-events: write

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build Lua and fetch vendored luacheck
        run: make lua vendor

      - name: Vendored luacheck is unmodified
        run: make vendor-verify

      - name: A failing spec must fail the runner
        run: make runner-selftest

      - name: Specs
        run: make test

      - name: Adversarial specs
        run: make adversarial

      # The precision step was wired to nothing that could run it: corpus/ is
      # gitignored and no step created it, so the gate took its skip path and
      # printed "ci-verify: PASS" — the measurement that exists to catch a rule
      # regression was skipped in the one job where a rule regression lands.
      # PRECISION_REQUIRE_CORPUS=1 turns that skip into a failure, so this step
      # either measures or is red; it cannot pass without having looked.
      - name: Clone the firmware corpora
        run: make corpus

      - name: Measured precision over the corpora
        env:
          PRECISION_REQUIRE_CORPUS: "1"
        run: make precision

      # A PR with no behavior change (dead code, documentation) has no spec
      # that can fail without it, so the TDD proof is skipped for those.
      - name: TDD proof
        if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'type:chore') && !contains(github.event.pull_request.labels.*.name, 'type:docs')
        run: make tdd-proof "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"

      - name: Scan the project with itself
        run: make selfscan

      - name: Export SARIF
        if: always()
        run: |
          ./bin/luasec --format sarif -o luasec.sarif src/ || true
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: luasec.sarif
          category: luasec

  action:
    # The action this repository publishes, run from this checkout on a clean
    # file, so a broken action.yml fails here and not in someone else's CI.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: luasec
        uses: ./
        with:
          path: test/fixtures/clean
          upload-sarif: "false"
      - name: The action reports a score
        run: test "${{ steps.luasec.outputs.score }}" = "100"

  rock:
    # The rock is built from this checkout exactly as LuaRocks would build the
    # release tarball, then run from the LuaRocks tree, not from the repository.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: "5.4"
      - uses: leafo/gh-actions-luarocks@v4
      - name: Fetch the vendored luacheck
        run: make vendor
      - name: Build and install the rock
        run: luarocks make --local luasec-scanner-*.rockspec
      - name: The installed command works
        run: |
          cd "$RUNNER_TEMP"
          export PATH="$HOME/.luarocks/bin:$PATH"
          luasec --version
          luasec rules explain 709 | head -3
          printf 'os.execute(io.read())\n' > t.lua
          set +e; luasec t.lua; status=$?; set -e
          test "$status" = 1

  homebrew:
    # The formula, installed from a tarball built from this checkout through a
    # local tap, the same way `brew install` installs the released one.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: make vendor
      - name: Install the formula from a local tap
        run: |
          file=$(scripts/release-tarball.sh)
          sha=$(shasum -a 256 "$file" | cut -d' ' -f1)
          version=$(sed -n 's/^ *luasec = "\(.*\)",$/\1/p' src/luasec/version.lua)
          brew tap-new --no-git local/luasec
          tap="$(brew --repository)/Library/Taps/local/homebrew-luasec"
          sed -e "s|https://github.com/Vaibhav91one/luasec/releases/download/v@VERSION@/luasec-@VERSION@.tar.gz|file://$PWD/$file|" \
              -e "s/@SHA256@/$sha/" -e "s/@VERSION@/$version/g" packaging/homebrew/luasec.rb > "$tap/Formula/luasec.rb"
          brew install --formula local/luasec/luasec
          brew test local/luasec/luasec
          luasec rules list | head -3

  npm-launcher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch the vendored luacheck
        run: make vendor
      - name: The launcher runs luasec from a release-shaped tarball
        run: node npm/test.js
